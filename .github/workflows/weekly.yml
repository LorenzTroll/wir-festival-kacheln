name: Weekly Tiles (Test A)

# Trigger:
#  - workflow_dispatch: manueller Knopf "Run workflow" im Actions-Tab
#  - schedule: Cron, Sonntag 16:00 UTC (= 18:00 MESZ). Fuer den reinen Test
#    auskommentiert, damit nicht ungewollt jede Woche laeuft. Spaeter aktivieren.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1'    # Montag 01:30 UTC = 03:30 MESZ — Nacht Sonntag->Montag

# Rechte fuer GitHub Pages — nutzt nur den eingebauten GITHUB_TOKEN, kein externes Secret.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # WICHTIG: Runner laeuft sonst auf UTC -> Uhrzeiten + Wochengrenzen waeren verschoben.
      TZ: 'Europe/Berlin'
      # Aktueller Feed (echte kommende Events). Review-Woche fest auf KW27/2026 gesetzt;
      # fuer vollen Live-Betrieb REF_DATE leeren -> rechnet ab heute ("diese Woche").
      ICS_URL: 'https://wir-halle.de/events.ics'
      REF_DATE: '2026-06-29'
      WEEK_OFFSET: '0'
      # Basis-URL fuer die image_url-Spalte in der CSV (Figma)
      PAGES_BASE_URL: 'https://lorenztroll.github.io/wir-festival-kacheln'
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Dependencies installieren (zieht Puppeteer + Chromium)
        run: npm ci

      - name: Kacheln + CSV + Galerie rendern
        run: npm run generate

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: output/ als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Auf GitHub Pages deployen
        id: deploy
        uses: actions/deploy-pages@v4
